# Local MongoDB for `pnpm dev` – on 27020, so it does not collide with the
# other apps' MongoDBs on this machine. Start: make up-db
services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - mongo_dev_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  mongo_dev_data:
